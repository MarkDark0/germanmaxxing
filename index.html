<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GermanMaxxing - Nauka Niemieckiego</title>
    <style>
        /* Minimalistyczny i nowoczesny styl */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            background-color: #ffffff;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
        }
        h1 {
            color: #0056b3; /* Głęboki niebieski */
            margin-bottom: 15px;
            font-size: 2.5em;
        }
        p {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 30px;
        }
        .btn-start {
            background-color: #28a745; /* Zielony akcent */
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            text-decoration: none; /* Dla linkowania */
            display: inline-block;
        }
        .btn-start:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🇩🇪 GermanMaxxing 🇩🇪</h1>
        <p>Twoja droga do płynnej znajomości języka niemieckiego. Zacznij naukę od podstaw, budując solidną bazę słownictwa!</p>
        
        <!-- Linkowanie do tasks.html -->
        <a href="tasks.html" class="btn-start">Początek Nauki</a>
    </div>
</body>
</html>
